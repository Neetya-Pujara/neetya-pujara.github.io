<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="A personal portfolio of work, experience, and recognition.">
  <title>Your Name | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f0;
      --ink: #20231f;
      --muted: #6d716b;
      --line: #dedfd8;
      --green: #245c46;
      --coral: #e56c4b;
      --blue: #cadbe3;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", sans-serif;
      --mono: "DM Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button { font: inherit; }
    .wrap { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }

    .topbar {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      color: var(--green);
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 700;
      text-decoration: none;
    }
    .nav { display: flex; gap: 30px; align-items: center; }
    .nav a {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: color .18s ease;
    }
    .nav a:hover, .nav a:focus-visible { color: var(--coral); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: clamp(48px, 9vw, 130px);
      align-items: center;
      padding-block: 94px 100px;
      animation: rise-in .7s both;
    }
    .eyebrow, .section-kicker, .card-meta, .portrait-caption {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .eyebrow { display: flex; gap: 10px; align-items: center; color: var(--green); }
    .eyebrow::before { width: 25px; height: 1px; background: var(--coral); content: ""; }
    h1 {
      max-width: 700px;
      margin: 24px 0 20px;
      font-family: var(--serif);
      font-size: clamp(48px, 6.4vw, 78px);
      font-weight: 500;
      line-height: 1.04;
    }
    h1 em { color: var(--green); font-weight: 500; }
    .bio { max-width: 570px; margin: 0; color: #565a54; font-size: 16px; line-height: 1.8; }
    .socials { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .social-link {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .2s, color .2s, transform .2s;
    }
    .social-link:hover { transform: translateY(-2px); border-color: var(--green); color: var(--green); }
    .social-link svg { width: 15px; height: 15px; fill: currentColor; }
    .portrait-wrap { position: relative; width: min(100%, 340px); justify-self: end; }
    .portrait-wrap::before {
      position: absolute;
      z-index: 0;
      top: 17px;
      left: -17px;
      width: 100%;
      height: 100%;
      border: 1px solid var(--coral);
      content: "";
    }
    .portrait {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: var(--blue);
      filter: saturate(.78);
    }
    .portrait-caption { position: relative; z-index: 1; margin: 15px 0 0; color: var(--muted); font-size: 9px; }

    .section { padding-block: 75px 82px; border-top: 1px solid var(--line); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
    .section-kicker { margin: 0 0 10px; color: var(--coral); }
    h2 { margin: 0; font-family: var(--serif); font-size: 42px; font-weight: 500; line-height: 1.15; }
    .section-note { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
    .rail-controls { display: flex; gap: 8px; }
    .rail-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }
    .rail-button:hover { border-color: var(--green); background: var(--green); color: white; }
    .rail-button svg { width: 16px; height: 16px; }
    .rail {
      display: grid;
      grid-auto-columns: minmax(260px, 1fr);
      grid-auto-flow: column;
      gap: 18px;
      overflow-x: auto;
      padding: 3px 2px 17px;
      scroll-snap-type: x mandatory;
      scrollbar-color: #b6b9b1 transparent;
      scrollbar-width: thin;
    }
    .work-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fbfaf7;
      scroll-snap-align: start;
      transition: border-color .2s, transform .2s;
    }
    .work-card:hover { transform: translateY(-3px); border-color: #b2b8ac; }
    .card-image { display: block; width: 100%; height: 190px; object-fit: cover; background: var(--blue); }
    .card-body { padding: 19px 20px 21px; }
    .card-meta { margin: 0 0 10px; color: var(--green); font-size: 9px; }
    .card-title { margin: 0; font-family: var(--serif); font-size: 23px; font-weight: 500; line-height: 1.25; }
    .card-description { min-height: 48px; margin: 10px 0 17px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .card-link { display: inline-flex; gap: 7px; align-items: center; color: var(--green); font-size: 12px; font-weight: 700; text-decoration: none; }
    .card-link:hover { color: var(--coral); }
    .card-link svg { width: 13px; height: 13px; transition: transform .2s; }
    .card-link:hover svg { transform: translate(2px, -2px); }

    .experience-section { background: #eaf0eb; }
    .experience-section .rail { scrollbar-color: #aebdb1 transparent; }
    .experience-section .work-card { background: #f7f8f4; }
    .experience-section .card-image { height: 170px; }

    .awards-list { border-top: 1px solid var(--line); }
    .award {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr) 30px;
      gap: 24px;
      align-items: start;
      padding: 23px 4px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      transition: padding .2s, color .2s;
    }
    .award:hover { padding-inline: 10px; color: var(--green); }
    .award-year { padding-top: 4px; color: var(--coral); font-family: var(--mono); font-size: 11px; }
    .award-title { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 500; }
    .award-description { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .award-arrow { justify-self: end; font-size: 20px; line-height: 1; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding-block: 25px 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

    @keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 1000px) { .rail { grid-auto-columns: calc((100% - 36px) / 3); } }
    @media (max-width: 720px) {
      .wrap { width: min(100% - 36px, 560px); }
      .topbar { height: 66px; }
      .nav { gap: 15px; }
      .nav a { font-size: 11px; }
      .hero { grid-template-columns: 1fr; gap: 37px; padding-block: 65px 72px; }
      h1 { font-size: clamp(48px, 12vw, 68px); }
      .portrait-wrap { width: min(75%, 300px); justify-self: start; margin-left: 17px; }
      .section { padding-block: 57px 63px; }
      h2 { font-size: 36px; }
      .section-head { align-items: end; }
      .section-note { display: none; }
      .rail { grid-auto-columns: minmax(250px, 82%); gap: 13px; }
      .award { grid-template-columns: 58px minmax(0, 1fr) 20px; gap: 12px; }
      .award-title { font-size: 19px; }
    }
    @media (max-width: 390px) {
      .wrap { width: calc(100% - 28px); }
      .nav { gap: 10px; }
      .nav a { font-size: 10px; }
      .wordmark { font-size: 20px; }
      .social-link { padding-inline: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar wrap">
    <a class="wordmark" href="#home" id="wordmark">YN.</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#awards">Awards</a>
    </nav>
  </header>

  <main>
    <section class="hero wrap" id="home" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow" id="hero-role">Independent thinker &amp; maker</p>
        <h1 id="hero-title">Hello, I’m <em id="hero-name">Your Name</em>.</h1>
        <p class="bio" id="hero-bio"></p>
        <div class="socials" id="socials" aria-label="Social links"></div>
      </div>
      <div class="portrait-wrap">
        <img class="portrait" id="headshot" alt="Temporary portrait placeholder; replace with your headshot">
        <p class="portrait-caption">Hello! Nice to meet you :)</p>
      </div>
    </section>

    <section class="section wrap" id="projects" aria-labelledby="projects-title">
      <div class="section-head">
        <div><p class="section-kicker">Selected work</p><h2 id="projects-title">Personal projects</h2></div>
        <div class="rail-controls" aria-label="Scroll projects">
          <button class="rail-button" type="button" data-scroll="projects-rail" data-direction="-1" aria-label="Scroll projects left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="rail-button" type="button" data-scroll="projects-rail" data-direction="1" aria-label="Scroll projects right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="rail" id="projects-rail" aria-label="Project cards"></div>
    </section>

    <section class="section experience-section" id="experience" aria-labelledby="experience-title">
      <div class="wrap">
        <div class="section-head">
          <div><p class="section-kicker">The path so far</p><h2 id="experience-title">Experience</h2></div>
          <div class="rail-controls" aria-label="Scroll experience">
            <button class="rail-button" type="button" data-scroll="experience-rail" data-direction="-1" aria-label="Scroll experience left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="rail-button" type="button" data-scroll="experience-rail" data-direction="1" aria-label="Scroll experience right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="rail" id="experience-rail" aria-label="Experience cards"></div>
      </div>
    </section>

    <section class="section wrap" id="awards" aria-labelledby="awards-title">
      <div class="section-head">
        <div><p class="section-kicker">A few meaningful moments</p><h2 id="awards-title">Awards &amp; recognition</h2></div>
      </div>
      <div class="awards-list" id="awards-list"></div>
    </section>
  </main>

  <footer class="wrap"><span id="footer-name">Neetya Pujara</span><span>Made with care · <span id="footer-year"></span></span></footer>

  <script>
    // Edit this object to make the site yours. Add or remove items in each list as needed.
    const siteData = {
      name: "Neetya",
      role: "Thinker, maker, and problem solver",
      bio: "Someone who loves computer science and math contests, and applying these fields to come up with effective solutions to real-world problems!",
      headshot: "images/headshot.jpeg",
      socials: [
        { name: "LinkedIn", url: "https://www.linkedin.com/in/neetya-pujara/", icon: "linkedin" },
        { name: "Medium", url: "https://medium.com/@neetyapujara", icon: "medium" },
        { name: "GitHub", url: "https://github.com/Neetya-Pujara", icon: "github" }
      ],
      projects: [
        { title: "A project you’re proud of", description: "Share the challenge, what you made, and the difference it made in one or two sentences.", image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=900&q=80", alt: "Colorful analytics dashboard on a screen", link: "https://example.com", label: "View project" },
        { title: "Something you made for fun", description: "A side project can show how you think, what you care about, and what you explore beyond work.", image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=900&q=80", alt: "Workspace with a laptop and code", link: "https://example.com", label: "Explore project" },
        { title: "A collaboration or experiment", description: "Highlight your contribution and the people, community, or question that brought the work to life.", image: "https://images.unsplash.com/photo-1523729603711-1b1b8c2f0f7b?auto=format&fit=crop&w=900&q=80", alt: "Creative planning notes and materials", link: "https://example.com", label: "See the work" }
      ],
      experience: [
        { title: "Your role · Organization", description: "Describe what you owned, how you worked with others, and one result you’re proud of.", image: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80", alt: "Bright collaborative office", link: "https://example.com", label: "Organization" },
        { title: "A previous role · Organization", description: "Focus on the work that shaped you. Add a concrete outcome or a lesson that still guides you.", image: "https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=900&q=80", alt: "Colleagues collaborating around a table", link: "https://example.com", label: "Organization" },
        { title: "A community role · Organization", description: "Include volunteer work, research, teaching, or other experience that matters to your story.", image: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=900&q=80", alt: "Team sharing ideas in a meeting", link: "https://example.com", label: "Organization" }
      ],
      awards: [
        { year: "20XX", title: "An award or recognition", description: "Add who recognized the work and what the honor meant. Keep it specific and personal.", link: "https://example.com" },
        { year: "20XX", title: "A milestone worth remembering", description: "A grant, fellowship, publication, competition, or other moment you’d like to share.", link: "https://example.com" }
      ]
    };

    const icons = {
      linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.34H4.96V9.02h2.97v9.32ZM6.45 7.75a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44Zm12 10.59h-2.96v-4.53c0-1.08-.02-2.46-1.5-2.46-1.5 0-1.73 1.17-1.73 2.38v4.61H9.3V9.02h2.84v1.27h.04c.4-.73 1.36-1.5 2.8-1.5 3 0 3.56 1.98 3.56 4.55v5Z"/></svg>',
      medium: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.54 12c0 3.48-2.78 6.3-6.21 6.3S1.12 15.48 1.12 12s2.78-6.3 6.21-6.3 6.21 2.82 6.21 6.3Zm6.81 0c0 3.28-1.39 5.94-3.1 5.94s-3.1-2.66-3.1-5.94 1.39-5.94 3.1-5.94 3.1 2.66 3.1 5.94Zm2.53 0c0 2.94-.49 5.32-1.09 5.32s-1.09-2.38-1.09-5.32.49-5.32 1.09-5.32 1.09 2.38 1.09 5.32Z"/></svg>',
      github: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.67-3.76-1.32-3.76-1.32-.51-1.3-1.24-1.65-1.24-1.65-1.01-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 1.71 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.06 1.14a10.65 10.65 0 0 1 5.57 0c2.12-1.44 3.06-1.14 3.06-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.02.76 2.06v3.11c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>'
    };

    const externalLink = (url) => /^https?:\/\//i.test(url);
    const safeHref = (url) => externalLink(url) ? url : "#";

    document.title = `${siteData.name} | Portfolio`;
    document.getElementById("hero-name").textContent = siteData.name;
    document.getElementById("hero-role").textContent = siteData.role;
    document.getElementById("hero-bio").textContent = siteData.bio;
    document.getElementById("headshot").src = siteData.headshot;
    document.getElementById("wordmark").textContent = `${siteData.name.split(/\s+/).map((part) => part[0]).join("").slice(0, 2)}.`;
    document.getElementById("footer-name").textContent = siteData.name;
    document.getElementById("footer-year").textContent = new Date().getFullYear();

    document.getElementById("socials").innerHTML = siteData.socials.map((social) => `
      <a class="social-link" href="${safeHref(social.url)}" target="_blank" rel="noreferrer" aria-label="${social.name} (opens in a new tab)">
        ${icons[social.icon] || ""}<span>${social.name}</span>
      </a>`).join("");

    function renderCards(items, railId) {
      document.getElementById(railId).innerHTML = items.map((item) => `
        <article class="work-card">
          <a href="${safeHref(item.link)}" target="_blank" rel="noreferrer" aria-label="${item.label}: ${item.title}">
            <img class="card-image" src="${item.image}" alt="${item.alt}" loading="lazy">
          </a>
          <div class="card-body">
            <p class="card-meta">${item.label}</p>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-description">${item.description}</p>
            <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noreferrer">Learn more <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12 12 4M5 4h7v7"/></svg></a>
          </div>
        </article>`).join("");
    }

    renderCards(siteData.projects, "projects-rail");
    renderCards(siteData.experience, "experience-rail");
    document.getElementById("awards-list").innerHTML = siteData.awards.map((award) => `
      <a class="award" href="${safeHref(award.link)}" target="_blank" rel="noreferrer">
        <span class="award-year">${award.year}</span>
        <div><h3 class="award-title">${award.title}</h3><p class="award-description">${award.description}</p></div>
        <span class="award-arrow" aria-hidden="true">↗</span>
      </a>`).join("");

    document.querySelectorAll("[data-scroll]").forEach((button) => {
      button.addEventListener("click", () => {
        const rail = document.getElementById(button.dataset.scroll);
        rail.scrollBy({ left: Number(button.dataset.direction) * rail.clientWidth * 0.8, behavior: "smooth" });
      });
    });
  </script>
</body>
</html>
